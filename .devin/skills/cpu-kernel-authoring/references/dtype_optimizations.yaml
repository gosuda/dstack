# Data Type Optimizations for CPU Kernels

bf16_on_cpu:
  name: "BFloat16 on CPU"
  description: |
    BF16 is the primary inference dtype for LLMs on CPU.
    AVX512-BF16 extension provides hardware support.
  key_instructions:
    - name: "_mm512_dpbf16_ps"
      description: "Dot product of bf16 pairs, accumulate in fp32"
      note: "Processes 16 bf16 pairs per call (k must be even)"
    - name: "_mm512_cvtne2ps_pbh"
      description: "Convert two fp32 vectors to one bf16 vector (round-to-nearest-even)"
    - name: "CVT_BF16_TO_FP32 macro"
      description: "Left-shift bf16 by 16 bits to get fp32 (exact, no rounding)"
      code: |
        #define CVT_BF16_TO_FP32(a) \
            _mm512_castsi512_ps(_mm512_slli_epi32(_mm512_cvtepu16_epi32(a), 16))
  precision_guidelines:
    - "Always accumulate in fp32 (_mm512 / float), never in bf16"
    - "Convert to bf16 only for final output store"
    - "Add epsilon BEFORE rsqrt, not after (avoids underflow)"
    - "Correctness: benchmark_cpu.py compares bf16 leaves in bf16 at half-ulp rtol; widen with --rtol only for accumulation-order differences"

fp16_on_cpu:
  name: "Float16 on CPU"
  description: |
    FP16 has better precision than BF16 (10-bit mantissa vs 7-bit)
    but narrower dynamic range (5-bit exponent vs 8-bit).
  support:
    avx2: "F16C extension: _mm256_cvtph_ps / _mm256_cvtps_ph (conversion only; compute in fp32)"
    avx512: "_mm512_cvtph_ps / _mm512_cvtps_ph (conversion only; compute in fp32)"
    avx512_fp16: "AVX512-FP16: Native 512-bit vector SIMD compute in ZMM registers (_mm512_add_ph, _mm512_mul_ph, _mm512_fmadd_ph), compiler flag -mavx512fp16"
    amx_fp16: "AMX-FP16: Native 2D tile matrix compute in TMM registers (_tile_dpfp16ps into fp32 tiles), compiler flags -mamx-fp16 and -march=graniterapids"
  note: |
    Architectures lacking native FP16 compute (F16C and base AVX-512) require converting to fp32 for calculation.
    Native FP16 compute distinguishes vector SIMD from matrix tile acceleration: AVX512-FP16 operates on 32-element 512-bit ZMM vector registers (-mavx512fp16), whereas AMX-FP16 operates on 2D TMM tile registers (-mamx-fp16).
    Never infer hardware capabilities from marketing family names alone: for example, Intel Xeon 6 includes both Sierra Forest (E-cores lacking AVX-512 and AMX) and Granite Rapids (P-cores supporting AVX512-FP16 and AMX-FP16). Verify capability through CPUID flags (avx512_fp16, amx_fp16) or specific microarchitecture targets.
    BF16 remains highly prevalent in the ecosystem because AMX-BF16 support was adopted earlier.

int8_quantization:
  name: "INT8 on CPU"
  description: |
    INT8 quantization for weight-only or W8A8 inference.
  instructions:
    avx512_vnni: "_mm512_dpbusd_epi32: uint8 × int8 → int32 dot product"
    amx_int8: "_tile_dpbssd: int8 × int8 → int32 tile multiply"
  pattern: |
    // W8A8: quantize activation, multiply, dequantize
    // 1. Quantize input: fp32/bf16 → int8 (per-token scale)
    // 2. GEMM: int8 × int8 → int32
    // 3. Dequantize: int32 → fp32/bf16 (multiply by scale_a × scale_w)

fp8_on_cpu:
  name: "FP8 on CPU"
  description: |
    FP8 (E4M3 or E5M2) conversion on CPU via bit manipulation.
    No native FP8 compute: convert to bf16 for computation.
  conversion: |
    // FP8 E4M3 -> BF16: rebase the exponent (bias 7 -> 127) and keep sign and mantissa
    inline __m512bh CVT_FP8_TO_BF16(__m256i a) {
        __m512i x = _mm512_cvtepu8_epi16(a);   // sign<<7 | exp(4b)<<3 | man(3b)
        __m512i vsign = _mm512_slli_epi16(_mm512_and_si512(x, _mm512_set1_epi16(0x80)), 8);
        x = _mm512_and_si512(x, _mm512_set1_epi16(0x7F));
        __m512i e = _mm512_srli_epi16(x, 3);   // exponent in bits 3-0
        __m512i m = _mm512_slli_epi16(_mm512_and_si512(x, _mm512_set1_epi16(0x7)), 4);  // 3-bit mantissa into BF16 bits 6-4
        __m512i r = _mm512_or_si512(_mm512_slli_epi16(_mm512_add_epi16(e, _mm512_set1_epi16(120)), 7), m);  // bias delta 127-7, exponent at bits 14-7
        r = _mm512_mask_mov_epi16(r, _mm512_cmpeq_epi16_mask(e, _mm512_setzero_si512()), _mm512_setzero_si512());  // e==0: flush subnormals to zero
        r = _mm512_mask_mov_epi16(r, _mm512_cmpeq_epi16_mask(x, _mm512_set1_epi16(0x7F)), _mm512_set1_epi16(0x7FC0));  // e=15, m=7: E4M3 NaN -> BF16 quiet NaN
        return (__m512bh)_mm512_or_si512(r, vsign);
    }

dtype_selection_guide:
  description: "Choose dtype based on operation type and precision needs"
  rules:
    - "Normalization (RMSNorm, LayerNorm): compute in fp32, output matches input dtype"
    - "GEMM: bf16 input, fp32 accumulate, bf16 output"
    - "Quantized GEMM: int4/int8 weights, bf16 activation, fp32 accumulate"
    - "Attention: bf16 QK^T, fp32 softmax, bf16 output"
    - "Activation functions: compute in fp32 if accuracy matters (GELU, SiLU)"
